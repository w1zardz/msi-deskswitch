name: Windows build and GoXLR checks

on:
  push:
    branches: [master]
    paths:
      - 'Windows/**'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test delayed Logitech Bolt replies
        shell: powershell
        run: .\Windows\Test-WheelRepair.ps1
      - name: Test GoXLR protocol and volume handling
        shell: powershell
        run: .\Windows\Test-GoXlr.ps1
      - name: Test native headphones overlay visibility
        shell: powershell
        run: .\Windows\Test-HeadphonesOverlay.ps1
      - name: Test GoXLR profile export
        shell: powershell
        run: .\Windows\Test-GoXlrExport.ps1
      - name: Test GoXLR profile import
        shell: powershell
        run: .\Windows\Test-GoXlrImport.ps1
      - name: Test GoXLR startup configuration
        shell: powershell
        run: .\Windows\Test-GoXlrStartup.ps1
      - name: Test OBS and GoXLR audio diagnostics
        shell: powershell
        run: .\Windows\Test-AudioSetupExport.ps1
      - name: Build Windows package
        shell: powershell
        run: .\Windows\Build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: DeskSwitch-Windows
          path: dist/DeskSwitch-Windows.zip
          if-no-files-found: error
          retention-days: 7
